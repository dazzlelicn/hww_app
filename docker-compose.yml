version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hww_app
      POSTGRES_USER: hww_user
      POSTGRES_PASSWORD: hww_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hww_user -d hww_app']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: change-in-production
      DATABASE_URL: postgresql://hww_user:hww_password@db:5432/hww_app?schema=public
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health/db || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
